<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="YAMAN Apt."><title>YAMAN Apt.</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f8;color:#101828}header{background:#07101f;color:#fff;padding:20px 16px}header h1{margin:0;font-size:27px}header p{margin:5px 0 0;color:#b8c1ce}nav{display:flex;gap:7px;padding:10px;overflow:auto;background:#fff;position:sticky;top:0;z-index:5}nav button{border:0;background:#e9edf3;padding:11px 14px;border-radius:13px;font-weight:700;white-space:nowrap}nav button.active{background:#07101f;color:#fff}main{padding:12px;max-width:950px;margin:auto}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#fff;border-radius:17px;padding:15px;box-shadow:0 2px 10px #0001}.label{color:#667085}.value{font-size:21px;font-weight:800;margin-top:4px}.monthbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:17px;padding:9px;margin:11px 0}.monthbar button{border:0;background:#e9edf3;border-radius:11px;padding:9px 15px;font-size:20px}.month{font-weight:800}.list{background:#fff;border-radius:17px;overflow:hidden}.row{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:14px;border-bottom:1px solid #edf0f4}.no{font-size:20px;font-weight:800}.name{font-weight:750}.sub{font-size:13px;color:#667085;margin-top:3px}.status{font-size:11px;font-weight:800;padding:6px 8px;border-radius:999px}.paid{background:#dff7e8;color:#147a3f}.unpaid{background:#ffe6e3;color:#a92a20}.exempt{background:#e6e9ff;color:#3949ab}.row button,.topbtn{border:0;border-radius:11px;padding:8px 10px;font-weight:700;margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap}.cancelPayBtn{background:#fff1f2;color:#b42318;border:1px solid #fda4af;border-radius:10px;padding:9px 11px;font-weight:700}
.messageBtn{background:#eef2f7;color:#344054}.messagePreview{background:#f4f6f8;border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.5}.smsBtn{background:#2185e5;color:#fff}.primary{background:#07101f;color:#fff}.secondary{background:#e9edf3}.section{margin-top:11px}.note{background:#fff7d6;padding:11px;border-radius:13px;color:#745b00;margin:9px 0;font-size:13px}.exp{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f4}.exp input{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}.total{font-size:18px;font-weight:800;padding-top:12px;display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:10px 8px;border-bottom:1px solid #edf0f4;text-align:left}th{font-size:12px;color:#667085}.modal{position:fixed;inset:0;background:#0008;display:none;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:23px 23px 0 0;padding:20px 16px 28px}.sheet h2{margin:0 0 14px}.field{margin:11px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:11px;font-size:16px}.modal-actions{display:flex;gap:8px;margin-top:17px}.modal-actions button{flex:1;padding:13px;border:0;border-radius:11px;font-weight:800;font-size:16px}@media(min-width:700px){.sheet{max-width:620px;margin:auto;border-radius:23px}.modal{align-items:center;padding:20px}}.bankHero{background:linear-gradient(135deg,#07101f,#1d3d6a);color:#fff}.bankHero .sub{color:#d7e2f0}.bankgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.bankitem{padding:13px 0;border-bottom:1px solid #edf0f4}.bankamount{font-weight:850}.in{color:#147a3f}.out{color:#b42318}.noteCard{padding:14px;border-radius:15px;background:#fff7d6;margin:9px 0}.noteActions{display:flex;gap:7px;margin-top:9px}.noteActions button{border:0;border-radius:10px;padding:8px 10px;font-weight:700}.danger{background:#fff1f2;color:#b42318}.info{background:#eef6ff;color:#175cd3;padding:12px;border-radius:13px}.sync{background:#eaf7ef;color:#147a3f;padding:12px;border-radius:13px;margin-top:10px}.warn{background:#fff7e6;color:#8a5a00;padding:12px;border-radius:13px;margin-top:10px}</style></head><body>
<header><h1>🏢 YAMAN Apt.</h1><p></p></header><nav><button data-tab="aidat">Aidatlar</button><button data-tab="banka">Banka</button><button data-tab="gider">Giderler</button><button data-tab="notlar">Notlar</button><button data-tab="ayar">Ayarlar</button></nav><main id="app"></main><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY="aidat_takip_v3",M=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"],GN=["Elektrik","Su","Temizlik","Asansör","Telefon","Bazı gereçler"];
const D={aidat:800,apartments:[["Mustafa",0],["Hasan",0],["Barış (Yönetici)",1],["Nurullah",0],["Arif",0],["Yücel",0],["Özgür",0],["Faruk",0]].map((x,i)=>({no:i+1,name:x[0],exempt:!!x[1],phone:"",pay:{}})),expenses:[],bank:[]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||D,tab="aidat",mi=new Date().getMonth();
data.notes=data.notes||[];data.bank=data.bank||[];data.aidat=Number(data.aidat||800);data.apartments.forEach(a=>{a.pay=a.pay||{};a.phone=a.phone||"";});
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)), money=n=>Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2})+" TL", mon=()=>M[mi], pm=a=>a.pay[mon()];
function col(){return data.apartments.reduce((s,a)=>s+(pm(a)?.paid?+pm(a).amount:0),0)}function debt(){return data.apartments.reduce((s,a)=>s+(a.exempt?0:(pm(a)?.paid?Math.max(0,data.aidat-(+pm(a).amount||0)):data.aidat)),0)}function exTotal(){return data.expenses.filter(e=>e.month===mon()).reduce((s,e)=>s+(+e.amount||0),0)}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));({aidat:aidat,banka:banka,gider:gider,notlar:notlar,ayar:ayar}[tab])()}
function aidat(){
let rows=data.apartments.map(a=>{
let p=pm(a)||{},st=a.exempt?'<span class="status exempt">YÖNETİCİ • MUAF</span>':p.paid?'<span class="status paid">ÖDENDİ</span>':'<span class="status unpaid">ÖDENMEDİ</span>';
let actions=a.exempt?"":`<div class="actions"><button class="secondary" onclick="payment(${a.no})">${p.paid?"Ödemeyi Düzenle":"Ödeme Gir"}</button>${p.paid?`<button class="cancelPayBtn" onclick="cancelPayment(${a.no})">Ödemeyi İptal Et</button>`:""}<button class="messageBtn" onclick="message(${a.no})">Mesaj</button></div>`;
return `<div class="row"><div class="no">${a.no}</div><div><div class="name">${a.name}</div><div class="sub">${a.exempt?"Aidat ödemez":money(data.aidat)+(p.paid?" • "+(p.date||""):"")}</div>${actions}</div><div>${st}</div></div>`
}).join("");
document.getElementById("app").innerHTML=`<div class="cards"><div class="card"><div class="label">Tahsilat</div><div class="value">${money(col())}</div></div><div class="card"><div class="label">Gider</div><div class="value">${money(exTotal())}</div></div><div class="card"><div class="label">Net</div><div class="value">${money(col()-exTotal())}</div></div><div class="card"><div class="label">Borç</div><div class="value">${money(debt())}</div></div></div><div class="monthbar"><button onclick="prev()">‹</button><div class="month">${mon()} ${new Date().getFullYear()}</div><button onclick="next()">›</button></div><div class="list">${rows}</div>`
}
function payment(no){let a=data.apartments.find(x=>x.no===no),p=pm(a)||{};open(`<h2>Daire ${no} • ${a.name}</h2><div class="field"><label>Ödeme tutarı (TL)</label><input id="amt" type="number" value="${p.amount??data.aidat}"></div><div class="field"><label>Tarih</label><input id="dt" type="date" value="${p.iso||new Date().toISOString().slice(0,10)}"></div><div class="modal-actions"><button class="secondary" onclick="closeM()">İptal</button><button class="primary" onclick="savePay(${no})">Kaydet</button></div>`)}
function savePay(no){let a=data.apartments.find(x=>x.no===no),d=document.getElementById("dt").value;a.pay[mon()]={paid:true,amount:+document.getElementById("amt").value||0,iso:d,date:d?d.split("-").reverse().join("."):""};save();closeM();render()}
function cancelPayment(no){let a=data.apartments.find(x=>x.no===no);if(!a)return;if(confirm("Ödemeyi iptal et?\n\nBu dairenin ödeme kaydı silinecek ve daire tekrar ÖDENMEDİ durumuna getirilecek.")){delete a.pay[mon()];save();render();}}
function gider(){let es=GN.map(n=>{let e=data.expenses.find(x=>x.month===mon()&&x.name===n)||{amount:""};return `<div class="exp"><b>${n}</b><input type="number" placeholder="Tutar" value="${e.amount}" onchange="setExp('${n}',this.value)"></div>`}).join("");document.getElementById("app").innerHTML=`<div class="card"><h2>${mon()} Giderleri</h2>${es}<div class="total"><span>TOPLAM GİDER</span><span>${money(exTotal())}</span></div></div><div class="card section"><button class="primary topbtn" onclick="addExpense()">＋ Gider kaydı ekle</button></div>`}
function setExp(name,val){let e=data.expenses.find(x=>x.month===mon()&&x.name===name);if(!e){e={month:mon(),name,amount:0,date:new Date().toISOString().slice(0,10)};data.expenses.push(e)}e.amount=+val||0;save();gider()}
function addExpense(){open(`<h2>Gider Kaydı</h2><div class="field"><label>Gider</label><select id="gn">${GN.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Tutar</label><input id="ga" type="number"></div><div class="modal-actions"><button class="secondary" onclick="closeM()">İptal</button><button class="primary" onclick="saveExp()">Kaydet</button></div>`)}
function saveExp(){setExp(document.getElementById("gn").value,document.getElementById("ga").value);closeM();render()}
function backup(){const blob=new Blob([JSON.stringify({app:"Aidat Takip",version:3,exportedAt:new Date().toISOString(),data},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Aidat-Takip-Yedek-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(){document.getElementById("backupFile").click()}
function restoreFile(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const d=x.data||x;if(!d.apartments||!Array.isArray(d.apartments)||!Array.isArray(d.expenses)||!Array.isArray(d.bank))throw new Error();if(confirm("Bu yedeği geri yüklemek mevcut kayıtların yerine geçecek. Devam edilsin mi?")){data=d;data.apartments.forEach(a=>{a.pay=a.pay||{};a.phone=a.phone||"";});save();render();alert("Yedek başarıyla geri yüklendi.")}}catch(e){alert("Bu dosya geçerli bir Aidat Takip yedeği değil.")}input.value=""};r.readAsText(f)}
function ayar(){
document.getElementById("app").innerHTML=`<div class="card"><h2>Ayarlar</h2>
<div class="field"><label>Aylık aidat</label><input id="fee" type="number" value="${data.aidat}"></div>
<button class="primary topbtn" onclick="data.aidat=+fee.value||0;save();render()">Aidatı Kaydet</button>
</div>
<div class="card section"><h2>Daireler</h2>
${data.apartments.map(a=>`<div class="field"><label>Daire ${a.no}${a.exempt?" • Yönetici / Muaf":""}</label><input id="apt${a.no}" value="${a.name}"></div><div class="field"><label>Daire ${a.no} telefon</label><input id="tel${a.no}" type="tel" inputmode="tel" placeholder="05xx xxx xx xx" value="${a.phone||""}"></div>`).join("")}
<button class="primary topbtn" onclick="saveApts()">Daire Bilgilerini Kaydet</button>
</div>
<div class="card section"><h2>Gider Kalemleri</h2>
${GN.map((g,i)=>`<div class="field"><label>Gider ${i+1}</label><input id="gn${i}" value="${g}"></div>`).join("")}
<button class="primary topbtn" onclick="saveGns()">Gider İsimlerini Kaydet</button>
</div>
<div class="card section"><h2>Yedekleme</h2>
<p class="sub">Aidat, daire, telefon, gider ve ödeme kayıtlarını dosya olarak saklayabilirsin.</p>
<button class="primary topbtn" onclick="backup()">Yedek Al</button>
<label class="topbtn secondary" style="display:block;text-align:center;cursor:pointer">Yedeği Geri Yükle<input id="backupFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreFile(this)"></label>
</div>`
}
function saveApts(){
data.apartments.forEach(a=>{a.name=document.getElementById("apt"+a.no).value.trim()||a.name;a.phone=document.getElementById("tel"+a.no).value.trim()});
save();render()
}
function saveGns(){for(let i=0;i<GN.length;i++){let v=document.getElementById("gn"+i).value.trim();if(v)GN[i]=v}save();render()}
function message(no){
let a=data.apartments.find(x=>x.no===no),p=pm(a)||{},paid=!!p.paid;
let date=p.date||new Date().toLocaleDateString("tr-TR");
let text=paid?`YAMAN APARTMANI\nSayın ${a.name},\nDaire ${a.no}'e ait ${mon()} ${new Date().getFullYear()} aidatınız ${date} tarihinde ödenmiştir.\nÖdemeniz için teşekkür ederiz.\n\nYAMAN APARTMANI YÖNETİMİ`:`YAMAN APARTMANI\nSayın ${a.name},\nDaire ${a.no}'e ait ${mon()} ${new Date().getFullYear()} aidatınız henüz ödenmemiştir.\nÖdeme durumunuzla ilgili bilgi vermenizi rica ederiz.\n\nYAMAN APARTMANI YÖNETİMİ`;
open(`<h2>Mesaj Önizleme</h2><div class="field"><label>Telefon</label><input id="msgPhone" type="tel" inputmode="tel" value="${a.phone||""}" placeholder="05xx xxx xx xx"></div><div class="field"><label>Mesaj</label><textarea id="msgText" style="width:100%;min-height:180px;padding:12px;border:1px solid #d0d5dd;border-radius:11px;font:inherit">${text}</textarea></div><div class="modal-actions"><button class="secondary" onclick="closeM()">Vazgeç</button><button class="smsBtn" onclick="sendSms(${no})">Mesajı Gönder</button></div>`)
}
function sendSms(no){
let a=data.apartments.find(x=>x.no===no),phone=document.getElementById("msgPhone").value.trim(),body=document.getElementById("msgText").value;
a.phone=phone;save();
if(!phone){alert("Önce telefon numarasını gir kanka.");return}
window.location.href="sms:"+phone+"?&body="+encodeURIComponent(body)
}


function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\\":"&#92;","\"":"&quot;"}[c]))}
function parseCSV(text){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1]; if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell.trim());cell='';if(row.some(x=>x!==''))rows.push(row);row=[]}else cell+=c}
  if(cell!==''||row.length){row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row)}
  return rows;
}
function bankMatch(desc,amount){
  const d=String(desc||'').toLocaleUpperCase('tr-TR');
  return data.apartments.find(a=>!a.exempt && String(a.name||'').split(/\s+/).some(w=>w.length>=3&&d.includes(w.toLocaleUpperCase('tr-TR'))) && Math.abs(Number(amount)-Number(data.aidat))<0.01);
}
function importBankFile(input){
 const f=input.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{try{
  const rows=parseCSV(r.result); if(rows.length<2)throw Error();
  const head=rows[0].map(x=>x.toLocaleLowerCase('tr-TR'));
  const find=(names)=>head.findIndex(h=>names.some(n=>h.includes(n)));
  const di=find(['tarih','date']); const ai=find(['açıklama','aciklama','description','işlem açıklaması']); const ti=find(['tutar','amount','miktar']);
  if(ai<0||ti<0)throw Error('columns');
  let added=0; rows.slice(1).forEach(r=>{let desc=r[ai]||'', amount=Number(String(r[ti]||'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,'')); if(!desc||!isFinite(amount)||amount<=0)return; let a=bankMatch(desc,amount); data.bank.push({id:Date.now()+'-'+Math.random(),date:r[di]||'',description:desc,amount,apartment:a?.no||null,matched:!!a}); if(a){let key=mon();a.pay[key]={paid:true,amount,date:r[di]||new Date().toLocaleDateString('tr-TR'),method:'Banka (Otomatik)',description:desc,transactionReference:'CSV-'+Date.now()};}added++});
  save(); render(); alert(added+' banka hareketi içe aktarıldı.');
 }catch(e){alert('CSV okunamadı. Tarih, Açıklama ve Tutar sütunları bulunmalı.')} input.value=''}; r.readAsText(f,'utf-8');
}
function banka(){
 const matched=data.bank.filter(x=>x.matched).length, unmatched=data.bank.filter(x=>!x.matched).length;
 const list=data.bank.slice(-12).reverse().map(x=>`<div class="bankitem"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(x.description)}</b><div class="sub">${esc(x.date)}${x.apartment?' • Daire '+x.apartment:''}</div></div><div class="bankamount in">+${money(x.amount)}</div></div><div class="sub">${x.matched?'✓ Eşleşti':'• Eşleşmedi'}</div></div>`).join('')||'<div class="sub" style="padding:12px 0">Henüz banka hareketi yok.</div>';
 document.getElementById('app').innerHTML=`<div class="card bankHero"><h2 style="margin-top:0">Banka Hareketleri</h2><p class="sub">Kuveyt Türk hareketlerini güvenli bir sunucu üzerinden YAMAN Apt.'a aktaracağız. Bu uygulamaya Secret veya Access Token koymuyoruz.</p><div class="bankgrid"><div class="card"><div class="label">Toplam İşlem</div><div class="value">${data.bank.length}</div></div><div class="card"><div class="label">Eşleşen</div><div class="value">${matched}</div></div><div class="card"><div class="label">Eşleşmeyen</div><div class="value">${unmatched}</div></div><div class="card"><div class="label">Bu Ay Tahsilat</div><div class="value">${money(col())}</div></div></div></div>
 <div class="card section"><h2>Ekstre / Test</h2><p class="sub">Şimdilik CSV ile test edebilirsin. Canlı Kuveyt Türk bağlantısı için aşağıdaki sunucu adresi hazırlanacak.</p><label class="primary topbtn" style="display:block;text-align:center;cursor:pointer">Ekstre Yükle<input type="file" accept=".csv,text/csv" style="display:none" onchange="importBankFile(this)"></label><div class="info">Canlı bağlantı için Kuveyt Türk API'sindeki <b>accounts</b> yetkisi ve güvenli backend gerekir.</div></div>
 <div class="card section"><h2>Son İşlemler</h2>${list}</div>`;
}
function notlar(){
 const list=data.notes.slice().reverse().map((n,i)=>`<div class="noteCard"><b>${esc(n.title)}</b><div class="sub">${esc(n.date||'')}</div><div style="margin-top:7px;white-space:pre-wrap">${esc(n.text)}</div><div class="noteActions"><button onclick="editNote(${data.notes.length-1-i})">Düzenle</button><button class="danger" onclick="deleteNote(${data.notes.length-1-i})">Sil</button></div></div>`).join('')||'<div class="sub">Henüz not yok.</div>';
 document.getElementById('app').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Notlar</h2><button class="primary topbtn" onclick="editNote(-1)">＋ Yeni Not</button></div>${list}</div>`;
}
function editNote(i){const n=i>=0?data.notes[i]:{title:'',text:'',date:new Date().toLocaleString('tr-TR')};open(`<h2>${i>=0?'Notu Düzenle':'Yeni Not'}</h2><div class="field"><label>Başlık</label><input id="nt" value="${esc(n.title)}"></div><div class="field"><label>Not</label><textarea id="nx" style="width:100%;min-height:150px;padding:12px;border:1px solid #d0d5dd;border-radius:11px;font:inherit">${esc(n.text)}</textarea></div><div class="modal-actions"><button class="secondary" onclick="closeM()">İptal</button><button class="primary" onclick="saveNote(${i})">Kaydet</button></div>`)}
function saveNote(i){const n={title:document.getElementById('nt').value.trim()||'Not',text:document.getElementById('nx').value.trim(),date:new Date().toLocaleString('tr-TR')};if(i>=0)data.notes[i]=n;else data.notes.push(n);save();closeM();render()}
function deleteNote(i){if(confirm('Bu not silinsin mi?')){data.notes.splice(i,1);save();render()}}

function open(x){sheet.innerHTML=x;modal.classList.add("show")}function closeM(){modal.classList.remove("show")}function prev(){mi=(mi+11)%12;render()}function next(){mi=(mi+1)%12;render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});const modal=document.getElementById("modal"),sheet=document.getElementById("sheet");modal.onclick=e=>{if(e.target===modal)closeM()};save();render();
</script></body></html>
