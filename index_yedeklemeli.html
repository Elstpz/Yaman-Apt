<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>Aidat Takip</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f8;color:#101828}header{background:#07101f;color:#fff;padding:20px 16px}header h1{margin:0;font-size:27px}header p{margin:5px 0 0;color:#b8c1ce}nav{display:flex;gap:7px;padding:10px;overflow:auto;background:#fff;position:sticky;top:0;z-index:5}nav button{border:0;background:#e9edf3;padding:11px 14px;border-radius:13px;font-weight:700;white-space:nowrap}nav button.active{background:#07101f;color:#fff}main{padding:12px;max-width:950px;margin:auto}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#fff;border-radius:17px;padding:15px;box-shadow:0 2px 10px #0001}.label{color:#667085}.value{font-size:21px;font-weight:800;margin-top:4px}.monthbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:17px;padding:9px;margin:11px 0}.monthbar button{border:0;background:#e9edf3;border-radius:11px;padding:9px 15px;font-size:20px}.month{font-weight:800}.list{background:#fff;border-radius:17px;overflow:hidden}.row{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:14px;border-bottom:1px solid #edf0f4}.no{font-size:20px;font-weight:800}.name{font-weight:750}.sub{font-size:13px;color:#667085;margin-top:3px}.status{font-size:11px;font-weight:800;padding:6px 8px;border-radius:999px}.paid{background:#dff7e8;color:#147a3f}.unpaid{background:#ffe6e3;color:#a92a20}.exempt{background:#e6e9ff;color:#3949ab}.row button,.topbtn{border:0;border-radius:11px;padding:8px 10px;font-weight:700;margin-top:5px}.primary{background:#07101f;color:#fff}.secondary{background:#e9edf3}.section{margin-top:11px}.note{background:#fff7d6;padding:11px;border-radius:13px;color:#745b00;margin:9px 0;font-size:13px}.exp{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f4}.exp input{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}.total{font-size:18px;font-weight:800;padding-top:12px;display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:10px 8px;border-bottom:1px solid #edf0f4;text-align:left}th{font-size:12px;color:#667085}.modal{position:fixed;inset:0;background:#0008;display:none;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:23px 23px 0 0;padding:20px 16px 28px}.sheet h2{margin:0 0 14px}.field{margin:11px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:11px;font-size:16px}.modal-actions{display:flex;gap:8px;margin-top:17px}.modal-actions button{flex:1;padding:13px;border:0;border-radius:11px;font-weight:800;font-size:16px}@media(min-width:700px){.sheet{max-width:620px;margin:auto;border-radius:23px}.modal{align-items:center;padding:20px}}</style></head><body>
<header><h1>🏢 Aidat Takip</h1><p>8 Daire • Aidat • Banka • Gider • Kasa</p></header><nav><button data-tab="aidat">Aidatlar</button><button data-tab="banka">Banka</button><button data-tab="gider">Giderler</button><button data-tab="ayar">Ayarlar</button></nav><main id="app"></main><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY="aidat_takip_v3",M=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"],GN=["Elektrik","Su","Temizlik","Asansör","Telefon","Bazı gereçler"];
const D={aidat:500,apartments:[["Mustafa",0],["Hasan",0],["Barış (Yönetici)",1],["Nurullah",0],["Arif",0],["Yücel",0],["Özgür",0],["Faruk",0]].map((x,i)=>({no:i+1,name:x[0],exempt:!!x[1],pay:{}})),expenses:[],bank:[]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||D,tab="aidat",mi=new Date().getMonth();data.apartments.forEach(a=>a.pay=a.pay||{});
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)), money=n=>Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2})+" TL", mon=()=>M[mi], pm=a=>a.pay[mon()];
function col(){return data.apartments.reduce((s,a)=>s+(pm(a)?.paid?+pm(a).amount:0),0)}function debt(){return data.apartments.reduce((s,a)=>s+(a.exempt?0:(pm(a)?.paid?Math.max(0,data.aidat-(+pm(a).amount||0)):data.aidat)),0)}function exTotal(){return data.expenses.filter(e=>e.month===mon()).reduce((s,e)=>s+(+e.amount||0),0)}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));({aidat:aidat,banka:banka,gider:gider,ayar:ayar}[tab])()}
function aidat(){let rows=data.apartments.map(a=>{let p=pm(a)||{},st=a.exempt?'<span class="status exempt">YÖNETİCİ • MUAF</span>':p.paid?'<span class="status paid">ÖDENDİ</span>':'<span class="status unpaid">ÖDENMEDİ</span>';return `<div class="row"><div class="no">${a.no}</div><div><div class="name">${a.name}</div><div class="sub">${a.exempt?"Aidat ödemez":money(data.aidat)+(p.paid?" • "+(p.date||""):"")}</div>${a.exempt?"":`<button class="secondary" onclick="payment(${a.no})">${p.paid?"Ödemeyi Düzenle":"Ödeme Gir"}</button>`}</div><div>${st}</div></div>`}).join("");document.getElementById("app").innerHTML=`<div class="cards"><div class="card"><div class="label">Tahsilat</div><div class="value">${money(col())}</div></div><div class="card"><div class="label">Gider</div><div class="value">${money(exTotal())}</div></div><div class="card"><div class="label">Net</div><div class="value">${money(col()-exTotal())}</div></div><div class="card"><div class="label">Borç</div><div class="value">${money(debt())}</div></div></div><div class="monthbar"><button onclick="prev()">‹</button><div class="month">${mon()} 2026</div><button onclick="next()">›</button></div><div class="note">Daire 3 • Barış: Yönetici olduğu için aidat muafıdır.</div><div class="list">${rows}</div>`}
function payment(no){let a=data.apartments.find(x=>x.no===no),p=pm(a)||{};open(`<h2>Daire ${no} • ${a.name}</h2><div class="field"><label>Ödeme tutarı (TL)</label><input id="amt" type="number" value="${p.amount??data.aidat}"></div><div class="field"><label>Tarih</label><input id="dt" type="date" value="${p.iso||new Date().toISOString().slice(0,10)}"></div><div class="modal-actions"><button class="secondary" onclick="closeM()">İptal</button><button class="primary" onclick="savePay(${no})">Kaydet</button></div>`)}
function savePay(no){let a=data.apartments.find(x=>x.no===no),d=document.getElementById("dt").value;a.pay[mon()]={paid:true,amount:+document.getElementById("amt").value||0,iso:d,date:d?d.split("-").reverse().join("."):""};save();closeM();render()}
function gider(){let es=GN.map(n=>{let e=data.expenses.find(x=>x.month===mon()&&x.name===n)||{amount:""};return `<div class="exp"><b>${n}</b><input type="number" placeholder="Tutar" value="${e.amount}" onchange="setExp('${n}',this.value)"></div>`}).join("");document.getElementById("app").innerHTML=`<div class="card"><h2>${mon()} Giderleri</h2>${es}<div class="total"><span>TOPLAM GİDER</span><span>${money(exTotal())}</span></div></div><div class="card section"><button class="primary topbtn" onclick="addExpense()">＋ Gider kaydı ekle</button></div>`}
function setExp(name,val){let e=data.expenses.find(x=>x.month===mon()&&x.name===name);if(!e){e={month:mon(),name,amount:0,date:new Date().toISOString().slice(0,10)};data.expenses.push(e)}e.amount=+val||0;save();gider()}
function addExpense(){open(`<h2>Gider Kaydı</h2><div class="field"><label>Gider</label><select id="gn">${GN.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Tutar</label><input id="ga" type="number"></div><div class="modal-actions"><button class="secondary" onclick="closeM()">İptal</button><button class="primary" onclick="saveExp()">Kaydet</button></div>`)}
function saveExp(){setExp(document.getElementById("gn").value,document.getElementById("ga").value);closeM();render()}
function banka(){let r=data.bank.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>Daire ${x.no}</td><td>${x.month}</td><td>${money(x.amount)}</td></tr>`).join("");document.getElementById("app").innerHTML=`<div class="card"><h2>Banka Girişi</h2><button class="primary topbtn" onclick="bankAdd()">＋ Banka Girişi</button></div><div class="section"><table><tr><th>Tarih</th><th>Daire</th><th>Ay</th><th>Tutar</th></tr>${r||"<tr><td colspan=4>Henüz kayıt yok.</td></tr>"}</table></div>`}
function bankAdd(){open(`<h2>Banka Girişi</h2><div class="field"><label>Daire</label><select id="bn">${data.apartments.map(a=>`<option value="${a.no}">${a.no} - ${a.name}</option>`).join("")}</select></div><div class="field"><label>Ay</label><select id="bm">${M.map((x,i)=>`<option value="${i}" ${i===mi?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Tutar</label><input id="ba" type="number"></div><div class="field"><label>Tarih</label><input id="bd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="modal-actions"><button class="secondary" onclick="closeM()">İptal</button><button class="primary" onclick="saveBank()">Kaydet</button></div>`)}
function saveBank(){let n=+document.getElementById("bn").value,m=+document.getElementById("bm").value,v=+document.getElementById("ba").value||0,d=document.getElementById("bd").value,a=data.apartments.find(x=>x.no===n);a.pay[M[m]]={paid:true,amount:v,iso:d,date:d.split("-").reverse().join(".")};data.bank.push({no:n,month:M[m],amount:v,date:d});save();closeM();render()}
function backup(){const blob=new Blob([JSON.stringify({app:"Aidat Takip",version:3,exportedAt:new Date().toISOString(),data},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Aidat-Takip-Yedek-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(){document.getElementById("backupFile").click()}
function restoreFile(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const d=x.data||x;if(!d.apartments||!Array.isArray(d.apartments)||!Array.isArray(d.expenses)||!Array.isArray(d.bank))throw new Error();if(confirm("Bu yedeği geri yüklemek mevcut kayıtların yerine geçecek. Devam edilsin mi?")){data=d;data.apartments.forEach(a=>a.pay=a.pay||{});save();render();alert("Yedek başarıyla geri yüklendi.")}}catch(e){alert("Bu dosya geçerli bir Aidat Takip yedeği değil.")}input.value=""};r.readAsText(f)}
function ayar(){document.getElementById("app").innerHTML=`<div class="card"><h2>Ayarlar</h2><div class="field"><label>Aylık aidat</label><input id="fee" type="number" value="${data.aidat}"></div><button class="primary topbtn" onclick="data.aidat=+fee.value||0;save();render()">Aidatı Kaydet</button></div><div class="card section"><h2>Yedekleme</h2><p class="sub">Tüm aidat, ödeme, banka ve gider kayıtlarını tek dosyaya kaydedebilirsin.</p><button class="primary topbtn" onclick="backup()">⬇️ Yedek Al</button><button class="secondary topbtn" onclick="restore()">⬆️ Yedeği Geri Yükle</button><input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreFile(this)"><p class="sub">Telefon değiştirirsen veya Safari kayıtları silinirse bu dosya ile kayıtlarını geri getirebilirsin.</p></div><div class="card section"><h2>Daireler</h2>${data.apartments.map(a=>`<div class="row"><div class="no">${a.no}</div><div><div class="name">${a.name}</div><div class="sub">${a.exempt?"Yönetici / Muaf":"Aidat öder"}</div></div></div>`).join("")}</div>`}
function open(x){sheet.innerHTML=x;modal.classList.add("show")}function closeM(){modal.classList.remove("show")}function prev(){mi=(mi+11)%12;render()}function next(){mi=(mi+1)%12;render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});const modal=document.getElementById("modal"),sheet=document.getElementById("sheet");modal.onclick=e=>{if(e.target===modal)closeM()};save();render();
</script></body></html>
