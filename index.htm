*{box-sizing:border-box}html,body{margin:0;background:#eef2f7;color:#142033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}body{padding-bottom:75px}.hd{background:linear-gradient(145deg,#0b2340,#123a63);color:#fff;padding:18px 15px}.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:13px;background:#fff;color:#1769e0;display:grid;place-items:center;font-size:23px}.brand h1{margin:0;font-size:22px}.brand small{color:#cbd8e8}.tabs{display:flex;gap:7px;padding:9px;background:#fff;position:sticky;top:0;z-index:5;overflow-x:auto}.tabs button,.bottom button{border:0;border-radius:12px;font-weight:800}.tabs button{padding:10px 13px;background:#edf1f5;color:#40506a;white-space:nowrap}.tabs .on{background:#0b2340;color:#fff}main{max-width:1050px;margin:auto;padding:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat,.card{background:#fff;border-radius:17px;box-shadow:0 3px 14px #12233d0d}.stat{padding:13px}.stat small{color:#718096;font-weight:700}.stat b{display:block;font-size:21px;margin-top:4px}.g b{color:#19a463}.r b{color:#ef5350}.b b{color:#1769e0}.o b{color:#d97706}.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:12px;margin-top:12px}.card{padding:14px}.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.ch h2{margin:0;font-size:17px}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:800}.blue{background:#1769e0;color:#fff}.light{background:#edf1f5;color:#334155}.green{background:#e4f7ed;color:#0d7a45}.orange{background:#fff3d8;color:#a85e00}.purple{background:#eee9ff;color:#6042cc}.apt{display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e5eaf1}.apt:last-child{border:0}.num{width:32px;height:32px;border-radius:10px;background:#e8f0ff;color:#1769e0;display:grid;place-items:center;font-weight:900}.nm{font-weight:800;font-size:14px}.sub{font-size:11px;color:#718096;margin-top:2px}.pill{font-size:10px;font-weight:900;padding:6px 8px;border-radius:99px;white-space:nowrap}.paid{background:#e4f7ed;color:#0d7a45}.unpaid{background:#ffe9e8;color:#c62f2b}.exempt{background:#eee9ff;color:#5b43bd}.icon{border:0;background:transparent;font-size:17px;padding:6px}.expense,.note{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e5eaf1}.expense:last-child,.note:last-child{border:0}.ico{width:35px;height:35px;border-radius:11px;background:#edf4ff;display:grid;place-items:center}.txt{flex:1}.txt b{font-size:13px}.txt span{display:block;color:#718096;font-size:11px;margin-top:2px}.amt{font-weight:900;color:#ef5350;font-size:13px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{text-align:left;padding:14px}.quick b{display:block}.quick small{color:#718096}.chart{display:grid;grid-template-columns:135px 1fr;gap:12px;align-items:center}.donut{width:125px;height:125px;border-radius:50%;background:conic-gradient(#19a463 0 62%,#f06a67 62%);position:relative;margin:auto}.donut:after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}.donut strong{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center}.legend div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e5eaf1;font-size:12px}.title{font-size:22px;font-weight:900;margin:4px 0 12px}.month{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;padding:8px;margin-bottom:12px}.month button{border:0;background:#edf1f5;border-radius:10px;padding:8px 14px;font-size:19px}.list{background:#fff;border-radius:17px;padding:8px 14px}.search{width:100%;padding:11px;border:1px solid #e0e6ee;border-radius:12px;margin-bottom:6px}.report{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.box{background:#fff;padding:14px;border-radius:15px;box-shadow:0 2px 12px #12233d0a}.box small{color:#718096}.box b{display:block;font-size:19px;margin-top:5px}.bars{height:180px;display:flex;align-items:flex-end;gap:12px;padding:15px}.barcol{flex:1;text-align:center;font-size:10px;color:#718096}.bar{width:30px;margin:auto;background:#1769e0;border-radius:8px 8px 2px 2px;min-height:8px}.setting{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e5eaf1}.setting:last-child{border:0}.setting .txt{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5eaf1;padding:7px 8px;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.bottom button{background:transparent;color:#64748b;padding:5px;font-size:10px}.bottom .on{background:#edf4ff;color:#1769e0}.bottom i{display:block;font-style:normal;font-size:19px}.modal{position:fixed;inset:0;background:#07101f88;display:none;align-items:flex-end;z-index:30}.modal.on{display:flex}.sheet{background:#fff;border-radius:22px 22px 0 0;padding:18px 15px 25px;width:100%;max-height:88vh;overflow:auto}.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d7dee8;border-radius:11px;font-size:16px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#142033;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:40;font-weight:800;font-size:12px}@media(max-width:760px){.stats,.report{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.apt{grid-template-columns:34px 1fr auto}.chart{grid-template-columns:115px 1fr}.donut{width:105px;height:105px}.donut:after{inset:22px}}@media(min-width:761px){.bottom{display:none}.modal{align-items:center;padding:20px}.sheet{max-width:620px;border-radius:22px}}
</style></head><body>
<header class="hd"><div class="brand"><div class="logo">🏢</div><div><h1>YAMAN APT.</h1><small>Apartman Yönetim Sistemi</small></div></div></header>
<nav class="tabs" id="tabs"><button data-p="home">Ana Sayfa</button><button data-p="aidat">Aidatlar</button><button data-p="gider">Giderler</button><button data-p="rapor">Raporlar</button><button data-p="not">Notlar</button><button data-p="ayar">Ayarlar</button></nav><main id="app"></main>
<nav class="bottom"><button data-p="home">⌂<br>Ana Sayfa</button><button data-p="aidat">₺<br>Aidatlar</button><button data-p="gider">＋<br>Giderler</button><button data-p="ayar">⚙<br>Ayarlar</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='yaman_apt_pro_v1',MS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];let data=JSON.parse(localStorage.getItem(KEY)||'null')||{fee:800,apartments:['Mustafa','Hasan','Barış (Yönetici)','Nurullah','Arif','Yücel','Özgür','Faruk'].map((name,i)=>({no:i+1,name,phone:'',exempt:i===2,pay:{}})),expenses:[],notes:[]};data.apartments.forEach(a=>{a.pay=a.pay||{};a.phone=a.phone||''});let page='home',mi=new Date().getMonth();const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),mon=()=>MS[mi],money=n=>Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2})+' TL',pay=a=>a.pay[mon()]||null,col=()=>data.apartments.reduce((s,a)=>s+(pay(a)?.paid?+pay(a).amount:0),0),exp=()=>data.expenses.filter(e=>e.month===mon()).reduce((s,e)=>s+(+e.amount||0),0),pc=()=>data.apartments.filter(a=>!a.exempt&&pay(a)?.paid).length,uc=()=>data.apartments.filter(a=>!a.exempt&&!pay(a)?.paid).length,debt=()=>data.apartments.reduce((s,a)=>s+(a.exempt?0:(pay(a)?.paid?Math.max(0,data.fee-(+pay(a).amount||0)):data.fee)),0);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}function go(p){page=p;render()}function nav(){document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===page))}function render(){nav();({home,aidat,gider,rapor,notlar,ayar}[page])();scrollTo(0,0)}
function row(a){let p=pay(a),s=a.exempt?'<span class="pill exempt">YÖNETİCİ • MUAF</span>':p?.paid?'<span class="pill paid">ÖDENDİ</span>':'<span class="pill unpaid">ÖDENMEDİ</span>';return `<div class="apt"><div class="num">${a.no}</div><div><div class="nm">${esc(a.name)}</div><div class="sub">${a.exempt?'Aidat ödemez':money(data.fee)}</div></div>${s}<div><button class="icon" onclick="${a.exempt?'':`payment(${a.no})`}">💰</button><button class="icon" onclick="message(${a.no})">💬</button></div></div>`}function expenseRow(e){return `<div class="expense"><div class="ico">${e.icon||'🧾'}</div><div class="txt"><b>${esc(e.name)}</b><span>${esc(e.date||'')}</span></div><div class="amt">${money(e.amount)}</div></div>`}
function home(){let pct=pc()+uc()?Math.round(pc()/(pc()+uc())*100):0;document.getElementById('app').innerHTML=`<div class="stats"><div class="stat g"><small>Toplanan Aidat</small><b>${money(col())}</b><small>Bu Ay</small></div><div class="stat r"><small>Toplam Gider</small><b>${money(exp())}</b><small>Bu Ay</small></div><div class="stat b"><small>Kasa</small><b>${money(col()-exp())}</b><small>Güncel Bakiye</small></div><div class="stat o"><small>Ödenmeyen Aidat</small><b>${money(debt())}</b><small>${uc()} Daire</small></div></div><div class="grid"><section class="card"><div class="ch"><h2>🏠 Daireler</h2><button class="btn blue" onclick="go('aidat')">Aidatları Gör</button></div>${data.apartments.map(row).join('')}</section><section><div class="card"><div class="ch"><h2>🧾 Bu Ayın Giderleri</h2><button class="btn blue" onclick="addExpense()">＋ Gider</button></div>${data.expenses.filter(e=>e.month===mon()).slice(0,4).map(expenseRow).join('')||'<span class="sub">Henüz gider yok.</span>'}</div><div class="card" style="margin-top:12px"><div class="ch"><h2>📝 Son Notlar</h2><button class="btn blue" onclick="addNote()">＋ Not</button></div>${data.notes.slice(0,3).map(n=>`<div class="note"><div class="ico">📌</div><div class="txt"><b>${esc(n.title)}</b><span>${esc(n.date)} • ${esc(n.text)}</span></div></div>`).join('')||'<span class="sub">Henüz not yok.</span>'}</div></section></div><div class="grid"><section class="card"><div class="ch"><h2>📊 Aidat Durumu (${mon()} 2026)</h2><button class="btn light" onclick="go('rapor')">Raporlar</button></div><div class="chart"><div class="donut"><strong>%${pct}<br><small>Ödendi</small></strong></div><div class="legend"><div>Ödeyen Daire <b>${pc()}</b></div><div>Ödemeyen Daire <b>${uc()}</b></div><div>Toplam Daire <b>${pc()+uc()}</b></div></div></div></section><section class="card"><div class="ch"><h2>⚡ Hızlı İşlemler</h2></div><div class="quick"><button class="btn green" onclick="go('aidat')">💰 <b>Ödeme Al</b><small>Aidat kaydı</small></button><button class="btn light" onclick="receipt()">🧾 <b>Makbuz</b><small>Son ödeme</small></button><button class="btn orange" onclick="go('aidat')">💬 <b>Mesaj</b><small>SMS hazırlama</small></button><button class="btn purple" onclick="go('rapor')">📈 <b>Raporlar</b><small>Aylık durum</small></button></div></section></div>`}
function aidat(){document.getElementById('app').innerHTML=`<div class="title">Aidatlar</div><div class="month"><button onclick="prev()">‹</button><b>${mon()} 2026</b><button onclick="next()">›</button></div><div class="list"><input class="search" id="q" placeholder="Daire / isim ara..." oninput="filter()">${data.apartments.map(row).join('')}</div>`}function filter(){let q=document.getElementById('q').value.toLowerCase();document.querySelectorAll('.list .apt').forEach((x,i)=>x.style.display=data.apartments[i].name.toLowerCase().includes(q)||String(data.apartments[i].no).includes(q)?'grid':'none')}
function payment(no){let a=data.apartments.find(x=>x.no===no),p=pay(a)||{};open(`<h2>Daire ${no} • ${esc(a.name)}</h2><div class="field"><label>Aidat Tutarı</label><input id="pa" type="number" value="${p.amount??data.fee}"></div><div class="field"><label>Ödeme Tarihi</label><input id="pd" type="date" value="${p.iso||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Ödeme Yöntemi</label><select id="pm"><option>Nakit</option><option>Havale</option><option>Diğer</option></select></div><div class="field"><label>Not</label><textarea id="pn" rows="3">${esc(p.note||'')}</textarea></div><div class="actions"><button class="btn light" onclick="closeM()">İptal</button><button class="btn blue" onclick="savePay(${no})">Kaydet</button></div>${p.paid?'<button class="btn" style="width:100%;margin-top:8px;background:#fff0f0;color:#c62f2b" onclick="cancelPay('+no+')">Ödemeyi Sil</button>':''}`)}function savePay(no){let a=data.apartments.find(x=>x.no===no),d=document.getElementById('pd').value;a.pay[mon()]={paid:true,amount:+document.getElementById('pa').value||0,iso:d,date:d?d.split('-').reverse().join('.'):'',method:document.getElementById('pm').value,note:document.getElementById('pn').value};save();closeM();render();toast('Ödeme kaydedildi ✓')}function cancelPay(no){let a=data.apartments.find(x=>x.no===no);if(confirm('Bu ayın ödeme kaydı silinsin mi?')){delete a.pay[mon()];save();closeM();render()}}
function gider(){let es=data.expenses.filter(e=>e.month===mon());document.getElementById('app').innerHTML=`<div class="title">Giderler</div><div class="stats"><div class="stat r"><small>Bu Ay</small><b>${money(exp())}</b></div><div class="stat b"><small>Kayıt</small><b>${es.length}</b></div></div><div class="card" style="margin-top:12px"><div class="ch"><h2>${mon()} 2026</h2><button class="btn blue" onclick="addExpense()">＋ Yeni Gider Ekle</button></div>${es.map((e,i)=>expenseRow(e)+`<div style="text-align:right"><button class="icon" onclick="delExp(${i})">🗑️</button></div>`).join('')||'<span class="sub">Henüz gider kaydı yok.</span>'}<hr style="border:0;border-top:1px solid #e5eaf1"><b style="display:flex;justify-content:space-between">TOPLAM GİDER <span>${money(exp())}</span></b></div>`}function addExpense(){open(`<h2>Yeni Gider Ekle</h2><div class="field"><label>Gider adı</label><input id="en" placeholder="Örn. Elektrik"></div><div class="field"><label>İkon</label><select id="ei"><option>⚡</option><option>💧</option><option>🧹</option><option>🔧</option><option>🧾</option></select></div><div class="field"><label>Tutar</label><input id="ea" type="number"></div><div class="field"><label>Tarih</label><input id="ed" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="actions"><button class="btn light" onclick="closeM()">İptal</button><button class="btn blue" onclick="saveExp()">Kaydet</button></div>`)}function saveExp(){let d=document.getElementById('ed').value;data.expenses.unshift({month:mon(),name:document.getElementById('en').value||'Diğer',icon:document.getElementById('ei').value,amount:+document.getElementById('ea').value||0,date:d?d.split('-').reverse().join('.'):'');save();closeM();render();toast('Gider eklendi ✓')}function delExp(i){let es=data.expenses.filter(e=>e.month===mon()),t=es[i],idx=data.expenses.indexOf(t);if(confirm('Gider silinsin mi?')){data.expenses.splice(idx,1);save();render()}}
function rapor(){let total=data.apartments.filter(a=>!a.exempt).length*data.fee,rate=total?Math.round(col()/total*100):0;document.getElementById('app').innerHTML=`<div class="title">Raporlar</div><div class="month"><button onclick="prev()">‹</button><b>${mon()} 2026</b><button onclick="next()">›</button></div><div class="report"><div class="box"><small>Toplam Aidat</small><b>${money(total)}</b></div><div class="box"><small>Tahsilat</small><b style="color:#19a463">${money(col())}</b></div><div class="box"><small>Gider</small><b style="color:#ef5350">${money(exp())}</b></div><div class="box"><small>Tahsilat Oranı</small><b style="color:#d97706">%${rate}</b></div></div><div class="card" style="margin-top:12px"><div class="ch"><h2>Aylık Durum Grafiği</h2></div><div class="bars">${[0,1,2,3,4,5].map(i=>`<div class="barcol"><div class="bar" style="height:${i===5?Math.max(10,Math.round(rate*1.3)):10}px"></div>${MS[(mi-5+i+12)%12].slice(0,3)}</div>`).join('')}</div></div>`}
function notlar(){document.getElementById('app').innerHTML=`<div class="title">Notlar</div><div class="card"><div class="ch"><h2>Genel Notlar</h2><button class="btn blue" onclick="addNote()">＋ Yeni Not Ekle</button></div>${data.notes.map((n,i)=>`<div class="note"><div class="ico">📌</div><div class="txt"><b>${esc(n.title)}</b><span>${esc(n.date)} • ${esc(n.text)}</span></div><button class="icon" onclick="delNote(${i})">🗑️</button></div>`).join('')||'<span class="sub">Henüz not yok.</span>'}</div>`}function addNote(){open(`<h2>Yeni Not</h2><div class="field"><label>Başlık</label><input id="nt" placeholder="Örn. Asansör bakımı"></div><div class="field"><label>Not</label><textarea id="nx" rows="5"></textarea></div><div class="actions"><button class="btn light" onclick="closeM()">İptal</button><button class="btn blue" onclick="saveNote()">Kaydet</button></div>`)}function saveNote(){data.notes.unshift({title:document.getElementById('nt').value||'Not',text:document.getElementById('nx').value,date:new Date().toLocaleDateString('tr-TR')});save();closeM();render();toast('Not eklendi ✓')}function delNote(i){if(confirm('Not silinsin mi?')){data.notes.splice(i,1);save();render()}}
function ayar(){document.getElementById('app').innerHTML=`<div class="title">Ayarlar</div><div class="card"><div class="ch"><h2>⚙️ Genel Ayarlar</h2></div><div class="setting"><div class="ico">🏢</div><div class="txt"><b>Apartman Adı</b><span>YAMAN Apt.</span></div></div><div class="setting"><div class="ico">₺</div><div class="txt"><b>Varsayılan Aidat</b><span>${money(data.fee)}</span></div><button class="btn light" onclick="fee()">Değiştir</button></div><div class="setting"><div class="ico">🏠</div><div class="txt"><b>Daire Sayısı</b><span>8 sabit daire</span></div></div></div><div class="card" style="margin-top:12px"><div class="ch"><h2>👥 Daire Bilgileri</h2></div>${data.apartments.map(a=>`<div class="setting"><div class="num">${a.no}</div><div class="txt"><b>${esc(a.name)}</b><span>${a.exempt?'Yönetici / Muaf':a.phone||'Telefon eklenmedi'}</span></div><button class="btn light" onclick="editApt(${a.no})">Düzenle</button></div>`).join('')}</div><div class="card" style="margin-top:12px"><div class="ch"><h2>💾 Veri İşlemleri</h2></div><button class="btn green" style="width:100%;margin-bottom:8px" onclick="backup()">Yedek Al</button><label class="btn light" style="display:block;text-align:center">Yedekten Geri Yükle<input type="file" accept=".json" onchange="restore(this)" style="display:none"></label></div>`}
function fee(){open(`<h2>Varsayılan Aidat</h2><div class="field"><label>Aylık aidat</label><input id="fv" type="number" value="${data.fee}"></div><div class="actions"><button class="btn light" onclick="closeM()">İptal</button><button class="btn blue" onclick="saveFee()">Kaydet</button></div>`)}function saveFee(){data.fee=+document.getElementById('fv').value||0;save();closeM();render();toast('Aidat güncellendi')}
function editApt(no){let a=data.apartments.find(x=>x.no===no);open(`<h2>Daire ${no}</h2><div class="field"><label>İsim</label><input id="an" value="${esc(a.name)}"></div><div class="field"><label>Telefon</label><input id="ap" type="tel" value="${esc(a.phone)}"></div><div class="actions"><button class="btn light" onclick="closeM()">İptal</button><button class="btn blue" onclick="saveApt(${no})">Kaydet</button></div>`)}function saveApt(no){let a=data.apartments.find(x=>x.no===no);a.name=document.getElementById('an').value||a.name;a.phone=document.getElementById('ap').value;save();closeM();render();toast('Daire bilgisi kaydedildi')}
function message(no){let a=data.apartments.find(x=>x.no===no),p=pay(a),text=p?.paid?`YAMAN APT.\nMerhaba ${a.name}, ${mon()} 2026 aidatınız ödenmiştir. Teşekkür ederiz.`:`YAMAN APT.\nMerhaba ${a.name}, ${mon()} 2026 aidatınız ${money(data.fee)} tutarındadır. Ödemenizi rica ederiz. Teşekkürler.`;open(`<h2>Mesaj • Daire ${no}</h2><div class="field"><label>Telefon</label><input id="mp" type="tel" value="${esc(a.phone)}"></div><div class="field"><label>Mesaj</label><textarea id="mx" rows="7">${esc(text)}</textarea></div><div class="actions"><button class="btn light" onclick="closeM()">Vazgeç</button><button class="btn blue" onclick="sendMsg(${no})">SMS'i Aç</button></div>`)}function sendMsg(no){let a=data.apartments.find(x=>x.no===no);a.phone=document.getElementById('mp').value;save();if(!a.phone){alert('Telefon numarası gir kanka.');return}location.href='sms:'+a.phone+'?&body='+encodeURIComponent(document.getElementById('mx').value)}
function receipt(){let a=data.apartments.find(x=>pay(x)?.paid);if(!a){alert('Önce ödeme kaydı gir kanka.');return}let p=pay(a);open(`<h2>🧾 Makbuz</h2><div class="card" style="box-shadow:none;border:1px solid #e5eaf1"><b>YAMAN Apt.</b><p>Daire ${a.no} • ${esc(a.name)}</p><p>${esc(p.date||'')} • ${mon()} 2026</p><h2>${money(p.amount)}</h2><p>Aidat ödemesi</p></div><div class="actions"><button class="btn light" onclick="closeM()">Kapat</button><button class="btn blue" onclick="print()">Yazdır / PDF</button></div>`)}
function backup(){let b=new Blob([JSON.stringify({app:'YAMAN Apt.',version:1,data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='YAMAN-Apt-Yedek.json';a.click()}function restore(i){let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.data.apartments)throw 0;data=x.data;save();render();toast('Yedek geri yüklendi ✓')}catch(e){alert('Geçerli YAMAN Apt. yedeği değil.')}};r.readAsText(i.files[0])}function open(x){document.getElementById('sheet').innerHTML=x;document.getElementById('modal').classList.add('on')}function closeM(){document.getElementById('modal').classList.remove('on')}function prev(){mi=(mi+11)%12;render()}function next(){mi=(mi+1)%12;render()}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};save();render();
</script></body></html>
